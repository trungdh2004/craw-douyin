<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160" fill="none">
  <defs>
    <linearGradient id="lockup-card" x1="0" y1="0" x2="680" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18191E" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>
    <linearGradient id="lockup-icon-bg" x1="28" y1="20" x2="132" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#232631" />
      <stop offset="100%" stop-color="#0C0D11" />
    </linearGradient>
    <linearGradient id="lockup-rim" x1="24" y1="24" x2="136" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="lockup-fg" x1="48" y1="40" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4D7E0" />
    </linearGradient>
  </defs>

  <!-- Outer Banner Surface -->
  <rect x="2" y="2" width="676" height="156" rx="28" fill="url(#lockup-card)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <!-- App Icon Squircle (112x112 at x=24, y=24) -->
  <rect x="24" y="24" width="112" height="112" rx="26" fill="url(#lockup-icon-bg)" />
  <rect x="24.75" y="24.75" width="110.5" height="110.5" rx="25.25" stroke="url(#lockup-rim)" stroke-width="1.5" />

  <!-- Concentric Radar Ring -->
  <circle cx="80" cy="83" r="36" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1.25" stroke-dasharray="3 4" />

  <!-- Nested 64x64 Icon scaled cleanly inside the 112x112 tile -->
  <g transform="translate(28, 28) scale(1.625)">
    <!-- Secondary Translucent Echo Layer -->
    <path
      d="M34.5 14.5
         C34.5 13.4 35.4 12.5 36.5 12.5
         H38.8
         C39.8 12.5 40.6 13.2 40.9 14.1
         C42.1 18.8 46.0 22.2 50.9 22.9
         C51.9 23.0 52.6 23.9 52.6 24.9
         V27.6
         C52.6 28.8 51.5 29.7 50.3 29.5
         C46.5 29.0 43.1 27.4 40.5 25.0
         V39.0
         A 13.5 13.5 0 1 1 27.0 25.5
         A 3.0 3.0 0 0 1 27.0 31.5
         A 7.5 7.5 0 1 0 34.5 39.0
         V14.5Z"
      fill="#9497A1"
      fill-opacity="0.35"
    />

    <!-- Primary Exact-Tangent Douyin Note & Capture Loop -->
    <path
      d="M31.8 12.8
         C31.8 11.5 32.8 10.5 34.1 10.5
         H36.2
         C37.2 10.5 38.1 11.2 38.4 12.2
         C39.6 16.9 43.5 20.4 48.5 21.1
         C49.6 21.3 50.4 22.2 50.4 23.3
         V26.0
         C50.4 27.3 49.3 28.3 48.0 28.1
         C44.1 27.6 40.6 25.9 38.0 23.4
         V37.5
         A 13.5 13.5 0 1 1 24.5 24.0
         A 3.1 3.1 0 0 1 24.5 30.2
         A 7.3 7.3 0 1 0 31.8 37.5
         V12.8Z"
      fill="url(#lockup-fg)"
    />

    <!-- Crisp Center Play Prism -->
    <path
      d="M22.2 34.3
         C22.2 33.4 23.2 32.9 23.9 33.3
         L29.1 36.4
         C29.8 36.8 29.8 37.9 29.1 38.3
         L23.9 41.4
         C23.2 41.8 22.2 41.3 22.2 40.4
         V34.3Z"
      fill="#FFFFFF"
    />

    <!-- Signal Node -->
    <circle cx="48.5" cy="14" r="1.8" fill="#ECEDEE" />
  </g>

  <!-- Typography Wordmark -->
  <text
    x="164"
    y="78"
    fill="#ECEDEE"
    font-family="'Geist Variable', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
    font-size="34"
    font-weight="650"
    letter-spacing="-0.03em"
  >
    Douyin Crawler
  </text>

  <!-- Subtitle Pill & Tagline -->
  <rect x="164" y="96" width="98" height="24" rx="6" fill="#23252C" stroke="#FFFFFF" stroke-opacity="0.08" />
  <text
    x="213"
    y="112"
    text-anchor="middle"
    fill="#ECEDEE"
    font-family="'Geist Mono Variable', 'SF Mono', ui-monospace, monospace"
    font-size="11"
    font-weight="600"
    letter-spacing="0.06em"
  >
    QUIET STUDIO
  </text>

  <text
    x="276"
    y="112.5"
    fill="#9497A1"
    font-family="'Geist Variable', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif"
    font-size="14"
    font-weight="500"
  >
    Media Archive · Scheduled Crawl · Edit Studio Bridge
  </text>
</svg>
