<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Douyin Crawler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-5xl px-6 py-16">
      <p class="mb-3 text-sm font-semibold uppercase tracking-widest text-cyan-400">Dashboard</p>
      <h1 class="text-4xl font-bold">Douyin Crawler</h1>
      <p class="mt-4 text-slate-300">Dashboard quản lý thu thập nội dung Douyin.</p>

      <section
        class="mt-10 rounded-2xl border border-slate-800 bg-slate-900 p-6"
        x-data="browserSession()"
        x-init="refresh()"
      >
        <h2 class="text-xl font-semibold">Trạng thái đăng nhập Douyin</h2>
        <div class="mt-4 flex flex-wrap items-center gap-4">
          <span class="rounded-full bg-slate-800 px-3 py-1 text-sm" x-text="statusLabel"></span>
          <button
            type="button"
            class="rounded-lg bg-cyan-500 px-4 py-2 font-semibold text-slate-950 disabled:cursor-not-allowed disabled:opacity-50"
            :disabled="status === 'LOGIN_IN_PROGRESS'"
            @click="login()"
          >
            Mở Chromium để đăng nhập
          </button>
        </div>
        <p class="mt-3 text-sm text-slate-400">
          Cửa sổ Chromium sử dụng profile lưu bền vững; hãy quét QR hoặc xử lý Captcha rồi đóng cửa sổ.
        </p>
      </section>

      <section class="mt-8 rounded-2xl border border-slate-800 bg-slate-900 p-6" x-data="targetsPanel()" x-init="load()">
        <h2 class="text-xl font-semibold">Mục tiêu quét</h2>
        <form class="mt-4 grid gap-3 md:grid-cols-5" @submit.prevent="create()">
          <input class="rounded bg-slate-800 p-2" placeholder="Tên" x-model="form.name" required>
          <select class="rounded bg-slate-800 p-2" x-model="form.target_type"><option>CHANNEL</option><option>KEYWORD</option></select>
          <input class="rounded bg-slate-800 p-2" placeholder="URL, sec_uid hoặc từ khóa" x-model="form.target_value" required>
          <input class="rounded bg-slate-800 p-2" x-model="form.cron_expr" required>
          <button class="rounded bg-cyan-500 p-2 font-semibold text-slate-950">Thêm mục tiêu</button>
        </form>
        <div class="mt-4 space-y-2">
          <template x-for="target in targets" :key="target.id"><div class="flex flex-wrap items-center gap-3 rounded bg-slate-800 p-3">
            <strong x-text="target.name"></strong><span class="text-sm text-slate-400" x-text="target.target_type + ' · ' + target.cron_expr"></span>
            <button class="ml-auto text-cyan-400" @click="run(target.id)">Chạy quét ngay</button>
            <button @click="edit(target)">Sửa</button>
            <button @click="toggle(target)" x-text="target.is_active ? 'Tắt' : 'Bật'"></button>
            <button class="text-rose-400" @click="remove(target.id)">Xóa</button>
          </div></template>
        </div>
      </section>

      <section class="mt-8 rounded-2xl border border-slate-800 bg-slate-900 p-6" x-data="libraryPanel()" x-init="load()">
        <div class="flex items-center gap-3"><h2 class="text-xl font-semibold">Thư viện Video</h2><button class="ml-auto rounded bg-cyan-500 px-3 py-2 text-slate-950" @click="downloadSelected()">Tải đã chọn</button></div>
        <div class="mt-4 grid gap-2 md:grid-cols-6"><input class="rounded bg-slate-800 p-2" placeholder="Tìm mô tả" x-model="filters.search"><input class="rounded bg-slate-800 p-2" type="number" placeholder="Tim tối thiểu" x-model="filters.min_digg"><select class="rounded bg-slate-800 p-2" x-model="filters.aweme_type"><option value="">Mọi loại</option><option value="0">Video</option><option value="68">Album</option></select><select class="rounded bg-slate-800 p-2" x-model="filters.download_status"><option value="">Mọi trạng thái</option><option>NONE</option><option>DOWNLOADING</option><option>COMPLETED</option><option>FAILED</option></select><select class="rounded bg-slate-800 p-2" x-model="filters.sort"><option value="create_time">Ngày đăng</option><option value="digg_count">Lượt tim</option><option value="share_count">Chia sẻ</option><option value="comment_count">Bình luận</option><option value="collect_count">Lượt lưu</option></select><button @click="load()">Lọc</button></div>
        <div class="mt-5 grid gap-4 md:grid-cols-3">
          <template x-for="video in videos" :key="video.aweme_id"><article class="rounded bg-slate-800 p-3">
            <img x-show="video.cover_url" :src="video.cover_url" class="aspect-video w-full rounded object-cover">
            <p class="mt-2 line-clamp-2" x-text="video.description"></p><p class="text-sm text-slate-400" x-text="`${video.author_nickname} · ❤ ${video.digg_count} · 💬 ${video.comment_count} · ↗ ${video.share_count} · 🔖 ${video.collect_count}`"></p><p class="text-xs text-slate-500" x-text="video.source_names.join(', ') + ' · ' + new Date(video.create_time).toLocaleDateString()"></p><p class="text-xs" x-text="video.download_error || video.video_local_path || video.download_status"></p>
            <div class="mt-2 flex gap-2"><input type="checkbox" :value="video.aweme_id" x-model="selected"><a class="text-cyan-400" :href="video.original_url" target="_blank">Xem gốc</a><button class="ml-auto" @click="download(video.aweme_id)" x-text="video.download_status === 'COMPLETED' ? 'Đã lưu' : 'Lưu Video'"></button></div>
          </article></template>
        </div>
      </section>

      <section class="mt-8 rounded-2xl border border-slate-800 bg-slate-900 p-6" x-data="logsPanel()" x-init="load()">
        <h2 class="text-xl font-semibold">Lịch sử quét</h2>
        <template x-for="log in logs" :key="log.id"><p class="mt-2 text-sm" x-text="`${log.target_name || 'Đã xóa'} · ${log.status} · ${new Date(log.started_at).toLocaleString()} → ${log.finished_at ? new Date(log.finished_at).toLocaleString() : 'đang chạy'} · mới ${log.new_videos_count} · cập nhật ${log.updated_videos_count} · ${log.error_message || ''}`"></p></template>
      </section>
    </main>
    <script>
      function browserSession() {
        return {
          status: 'CHECKING',
          get statusLabel() {
            return {
              CHECKING: 'Đang kiểm tra…',
              AUTHENTICATED: 'Đã đăng nhập',
              LOGIN_REQUIRED: 'Cần đăng nhập',
              LOGIN_IN_PROGRESS: 'Đang mở Chromium…'
            }[this.status] || 'Không xác định';
          },
          async refresh() {
            const response = await fetch('/api/browser/status');
            this.status = (await response.json()).status;
            if (this.status === 'LOGIN_IN_PROGRESS') {
              window.setTimeout(() => this.refresh(), 1500);
            }
          },
          async login() {
            const response = await fetch('/api/browser/login', { method: 'POST' });
            this.status = (await response.json()).status;
            window.setTimeout(() => this.refresh(), 1500);
          }
        };
      }
      function targetsPanel() { return { targets: [], form: {name:'', target_type:'CHANNEL', target_value:'', cron_expr:'0 */6 * * *', max_items_per_run:50}, async load(){this.targets=await (await fetch('/api/targets')).json()}, async create(){await fetch('/api/targets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.form)});await this.load()}, async run(id){await fetch(`/api/targets/${id}/run`,{method:'POST'})}, async edit(t){const name=prompt('Tên mục tiêu',t.name);const cron=prompt('Lịch Cron',t.cron_expr);if(name&&cron){await fetch(`/api/targets/${t.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,cron_expr:cron})});await this.load()}}, async toggle(t){await fetch(`/api/targets/${t.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:!t.is_active})});await this.load()}, async remove(id){await fetch(`/api/targets/${id}`,{method:'DELETE'});await this.load()} }; }
      function libraryPanel() { return { videos:[], selected:[], filters:{search:'',min_digg:'',aweme_type:'',download_status:'',sort:'create_time'}, async load(){const query=new URLSearchParams(Object.fromEntries(Object.entries(this.filters).filter(([,v])=>v!=='')));const data=await (await fetch(`/api/videos?${query}`)).json();this.videos=data.items}, async download(id){await fetch(`/api/videos/${id}/download`,{method:'POST'});setTimeout(()=>this.load(),1000)}, async downloadSelected(){if(!this.selected.length)return;await fetch('/api/videos/batch-download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aweme_ids:this.selected})});this.selected=[];setTimeout(()=>this.load(),1000)} }; }
      function logsPanel() { return {logs:[],async load(){const page=await (await fetch('/api/logs')).json();this.logs=page.items}}; }
    </script>
  </body>
</html>
