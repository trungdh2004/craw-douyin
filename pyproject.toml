[project]
name = "douyin-crawler"
version = "0.1.0"
description = "Scheduled Douyin metadata crawler and on-demand media downloader"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17,<2",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.31,<1",
    "fastapi>=0.121,<1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.11,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "testcontainers[postgres]>=4.13,<5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["douyin_crawler"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/douyin_crawler"]
